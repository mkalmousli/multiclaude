[project]
name = "multiclaude"
version = "0.2.0"
description = "Run multiple isolated Claude Code logins side by side"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mohamad Almousli" }]
keywords = ["claude", "claude-code", "cli", "multi-account", "anthropic"]
classifiers = ["Environment :: Console", "Programming Language :: Python :: 3", "Topic :: Software Development"]
dependencies = []

[project.urls]
Homepage = "https://al-mo.de/tools/mcl/"
Repository = "https://github.com/mkalmousli/multiclaude"

[project.scripts]
mcl = "multiclaude.cli:main"
multiclaude = "multiclaude.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/multiclaude"]
