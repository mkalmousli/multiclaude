<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-label="mcl terminal demo">
  <rect width="720" height="360" rx="12" fill="#14161c"/>
  <rect width="720" height="36" rx="12" fill="#1e222b"/>
  <rect y="24" width="720" height="12" fill="#1e222b"/>
  <circle cx="22" cy="18" r="6" fill="#ff5f56"/><circle cx="42" cy="18" r="6" fill="#ffbd2e"/><circle cx="62" cy="18" r="6" fill="#27c93f"/>
  <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15">
    <text x="24" y="70" fill="#8b93a7">$ <tspan fill="#e6e9f0">mcl new work --share</tspan></text>
    <text x="24" y="94" fill="#5ad4a0">created ~/.multiclaude/work</text>
    <text x="24" y="132" fill="#8b93a7">$ <tspan fill="#e6e9f0">mcl new personal</tspan></text>
    <text x="24" y="156" fill="#5ad4a0">created ~/.multiclaude/personal</text>
    <text x="24" y="194" fill="#8b93a7">$ <tspan fill="#e6e9f0">mcl ls</tspan></text>
    <text x="24" y="218" fill="#e6e9f0">work      <tspan fill="#d9a066">me@company.com</tspan>     <tspan fill="#8b93a7">2h ago</tspan></text>
    <text x="24" y="242" fill="#e6e9f0">personal  <tspan fill="#d9a066">me@gmail.com</tspan>       <tspan fill="#8b93a7">just now</tspan></text>
    <text x="24" y="280" fill="#8b93a7">$ <tspan fill="#e6e9f0">mcl work -c</tspan></text>
    <text x="24" y="304" fill="#d9a066">&#10022; Welcome back to Claude Code</text>
    <text x="24" y="328" fill="#8b93a7">&gt; <tspan fill="#e6e9f0">_</tspan></text>
  </g>
</svg>
